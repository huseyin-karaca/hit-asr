# Build the level-1 container and push it to ghcr.io/huseyin-karaca/hit-asr. Run by hand (Actions → docker → Run
# workflow) — nothing builds it on its own yet.
name: docker
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag"
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
