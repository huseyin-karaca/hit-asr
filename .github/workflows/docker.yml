# Build the two containers and push them to ghcr.io/huseyin-karaca/hit-asr: `:cpu` (docker/Dockerfile, level 1) and
# `:cuda` (docker/Dockerfile.cuda, levels 1-3). Run by hand (Actions → docker → Run workflow).
name: docker
on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "optional tag suffix, e.g. -v1 gives :cpu-v1 and :cuda-v1"
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cpu
            file: docker/Dockerfile
          - tag: cuda
            file: docker/Dockerfile.cuda
    steps:
      - name: Free disk for the CUDA layers
        if: matrix.tag == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.tag }}${{ inputs.suffix }}
